[package]
name = "jetdb"
version = "0.3.3"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Pure Rust library for reading Microsoft Access (.mdb/.accdb) files"
repository = "https://github.com/dominion525/jetdb"
documentation = "https://docs.rs/jetdb"
readme = "../../README.md"
keywords = ["access", "mdb", "accdb", "jet", "database"]
categories = ["database", "parser-implementations"]
rust-version = "1.86"
exclude = ["testdata/", "AGENTS*", "CLAUDE*", ".claude/"]

[dependencies]
aes = "0.8"
base64 = "0.22"
cbc = "0.1"
ecb = "0.1"
cfb = "0.14"
log = "0.4"
ovba = "0.7"
sha1 = "0.10"
sha2 = "0.10"
quick-xml = "0.42"
subtle = "2.6"
zeroize = "1.8"
encoding_rs = "0.8.35"

# Browser Wasm tests (tests/wasm_browser.rs), run with wasm-bindgen-test-runner.
# wasm-bindgen-test pins an exact wasm-bindgen, and the runner binary must match
# that same version: 0.3.58 pins wasm-bindgen 0.2.108, the version cfb pulls in.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "=0.3.58"
