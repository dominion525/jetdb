[package]
name = "jetdb-cli"
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "CLI tool for reading Microsoft Access (.mdb/.accdb) files"
repository = "https://github.com/dominion525/jetdb"
readme = "../../README.md"
keywords = ["access", "mdb", "accdb", "jet", "cli"]
categories = ["command-line-utilities", "database"]
rust-version = "1.87"
exclude = ["testdata/", "AGENTS*", "CLAUDE*", ".claude/"]

[[bin]]
name = "jetdb"
path = "src/main.rs"
doc = false

[dependencies]
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
jetdb = { version = "0.4.0", path = "../jetdb" }
log = "0.4"
unicode-width = "0.2.2"
