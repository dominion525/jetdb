name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag against the crate versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="${TAG#v}"
          mismatch=0
          for manifest in crates/jetdb/Cargo.toml crates/jetdb-cli/Cargo.toml; do
            actual="$(sed -n 's/^version = "\(.*\)"$/\1/p' "$manifest" | head -1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$manifest::version is $actual, but the tag asks for $expected"
              mismatch=1
            fi
          done
          exit $mismatch

  test:
    name: Test (${{ matrix.os }})
    needs: version
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch test data
        run: scripts/fetch-testdata.sh
        shell: bash
      - run: cargo test

  build:
    name: Build (${{ matrix.target }})
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p jetdb-cli

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: tar czf jetdb-${{ matrix.target }}.tar.gz -C target/release jetdb

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path target/release/jetdb.exe -DestinationPath jetdb-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: jetdb-${{ matrix.target }}
          path: jetdb-${{ matrix.target }}.${{ matrix.archive }}

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          prerelease=""
          if echo "$tag" | grep -qE '(alpha|beta|rc)'; then
            prerelease="--prerelease"
          fi
          gh release create "$tag" $prerelease --generate-notes artifacts/*

  publish:
    name: Publish
    needs: release
    runs-on: ubuntu-latest
    # Trusted Publishing: the OIDC token minted here is exchanged for a
    # short-lived crates.io token, so no registry token is stored in the
    # repository. crates.io authorises it against a per-crate configuration
    # naming this repository and workflow file.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # jetdb-cli depends on jetdb by version, so jetdb has to reach the
      # registry first.
      - run: cargo publish -p jetdb
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - run: cargo publish -p jetdb-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
