name: Release

on:
  push:
    tags: ['v*']
  # Publishes only the npm package, of the version given, from main, which CI
  # has tested: to try the publishing to npm without a release.
  workflow_dispatch:
    inputs:
      npm-version:
        description: Version of the jetdb-wasm package to publish to npm
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag against the crate versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="${TAG#v}"
          mismatch=0
          for manifest in crates/jetdb/Cargo.toml crates/jetdb-cli/Cargo.toml crates/jetdb-wasm/Cargo.toml; do
            actual="$(sed -n 's/^version = "\(.*\)"$/\1/p' "$manifest" | head -1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$manifest::version is $actual, but the tag asks for $expected"
              mismatch=1
            fi
          done
          exit $mismatch

  test:
    name: Test (${{ matrix.os }})
    needs: version
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch test data
        uses: ./.github/actions/fetch-testdata
      - run: cargo test

  # Same Wasm checks as CI; see ci.yml for what each covers.
  wasm-test:
    name: Wasm test (wasm32-wasip1)
    needs: version
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --dir ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: Fetch test data
        uses: ./.github/actions/fetch-testdata
      - run: cargo test --target wasm32-wasip1 -p jetdb

  wasm-browser-test:
    name: Wasm test (wasm32-unknown-unknown)
    needs: version
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install wasm-bindgen
        uses: ./.github/actions/install-wasm-bindgen
      - name: Fetch test data
        uses: ./.github/actions/fetch-testdata
      - run: cargo test --target wasm32-unknown-unknown -p jetdb --test wasm_browser

  build:
    name: Build (${{ matrix.target }})
    needs: [test, wasm-test, wasm-browser-test]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p jetdb-cli

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: tar czf jetdb-${{ matrix.target }}.tar.gz LICENSE-MIT LICENSE-APACHE -C target/release jetdb

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path target/release/jetdb.exe, LICENSE-MIT, LICENSE-APACHE -DestinationPath jetdb-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: jetdb-${{ matrix.target }}
          path: jetdb-${{ matrix.target }}.${{ matrix.archive }}

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          prerelease=""
          if echo "$tag" | grep -qE '(alpha|beta|rc)'; then
            prerelease="--prerelease"
          fi
          gh release create "$tag" $prerelease --generate-notes artifacts/*

  publish:
    name: Publish
    needs: release
    runs-on: ubuntu-latest
    # Trusted Publishing: the OIDC token minted here is exchanged for a
    # short-lived crates.io token, so no registry token is stored in the
    # repository. crates.io authorises it against a per-crate configuration
    # naming this repository and workflow file.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # jetdb-cli depends on jetdb by version, so jetdb has to reach the
      # registry first. A crate whose version is on crates.io already is
      # skipped, so that a re-run of this job, after jetdb-cli failed, publishes
      # what is left.
      - name: Publish the crates unless their versions are on crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          for crate in jetdb jetdb-cli; do
            version="$(sed -n 's/^version = "\(.*\)"$/\1/p' "crates/$crate/Cargo.toml" | head -1)"
            # crates.io answers 200 for a version it has, and 404 for a version,
            # or a crate, it has not. It refuses a request with no User-Agent.
            status="$(curl -sS -o /dev/null -w '%{http_code}' \
              -A 'jetdb release workflow (https://github.com/dominion525/jetdb)' \
              "https://crates.io/api/v1/crates/$crate/$version")" || status=failed
            case "$status" in
              200)
                echo "$crate $version is on crates.io; not publishing"
                ;;
              404)
                cargo publish -p "$crate"
                ;;
              *)
                echo "::error::could not tell whether $crate $version is on crates.io (HTTP $status)"
                exit 1
                ;;
            esac
          done

  npm:
    name: Publish (npm)
    # After the GitHub release of a tag, beside the crates; alone when run by
    # hand.
    needs: release
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    # Trusted Publishing, as for crates.io: npm exchanges the OIDC token for a
    # short-lived one, against the configuration of the package on npmjs.com,
    # which names this repository and workflow file. It needs npm 11.5.1 or
    # later, which Node.js 24 comes with. That configuration is made on the
    # page of the package, so the package has to be on npm, published once by
    # hand, before this job can publish to it.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Run by hand only from main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::run it by hand from main, not $GITHUB_REF"
          exit 1
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Install wasm-bindgen
        uses: ./.github/actions/install-wasm-bindgen
      - name: Fetch test data
        uses: ./.github/actions/fetch-testdata
      - run: scripts/build-wasm-package.sh
      - name: Set the version given by hand
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.npm-version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::npm-version is not a version: $VERSION"
            exit 1
          fi
          jq --arg version "$VERSION" '.version = $version' crates/jetdb-wasm/pkg/package.json \
            > package.json.tmp
          mv package.json.tmp crates/jetdb-wasm/pkg/package.json
      - run: scripts/test-wasm-package.sh
      - name: Publish unless the version is on npm
        working-directory: crates/jetdb-wasm/pkg
        run: |
          version="$(jq -r .version package.json)"
          # npm view fails with E404 for a version, or a package, not on npm.
          if found="$(npm view "jetdb-wasm@$version" version 2>&1)"; then
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              echo "::error::jetdb-wasm $version is on npm already"
              exit 1
            fi
            echo "jetdb-wasm $version is on npm; not publishing"
            exit 0
          elif ! grep -q E404 <<<"$found"; then
            echo "$found" >&2
            echo "::error::could not tell whether jetdb-wasm $version is on npm"
            exit 1
          fi
          # A prerelease, as the GitHub release marks one, does not become the
          # version npm installs by default.
          if [[ "$version" == *-* ]]; then
            npm publish --tag next
          else
            npm publish
          fi

  homebrew:
    name: Homebrew
    # After the GitHub release of a tag that is not a prerelease, so that brew
    # installs only the version the release marks as the latest.
    needs: release
    if: ${{ !contains(github.ref_name, '-') && !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The token is a fine-grained PAT that can write to the tap alone.
      - name: Check out the Homebrew tap
        uses: actions/checkout@v5
        with:
          repository: dominion525/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update the Homebrew formula
        env:
          FORMULA: tap/Formula/jetdb.rb
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          # Only the lines that change per release are touched: the version in
          # the url of each archive, and the sha256 on the line after it. The
          # rest of the formula stays owned by the tap.
          for target in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            archive="jetdb-${target}.tar.gz"
            url="https://github.com/dominion525/jetdb/releases/download/v${version}/${archive}"
            sha="$(sha256sum "artifacts/$archive" | cut -d' ' -f1)"
            sed -i "s|\"https://github.com/dominion525/jetdb/releases/download/v[^/]*/${archive}\"\$|\"${url}\"|" "$FORMULA"
            sed -i "\\|\"${url}\"\$|{n;s|sha256 \".*\"|sha256 \"${sha}\"|}" "$FORMULA"
            # A sed that matched nothing would leave the formula stale
            # without failing, so check each.
            grep -A1 -F "\"${url}\"" "$FORMULA" | grep -q "sha256 \"${sha}\"" \
              || { echo "::error::$archive was not updated in $FORMULA"; exit 1; }
          done
          ruby -c "$FORMULA"

          cd tap
          if git diff --quiet; then
            echo "The formula already points at ${version}."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -am "jetdb ${version}"
          git push
