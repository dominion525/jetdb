name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  msrv:
    name: MSRV (1.87)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  test:
    name: Test (${{ matrix.os }})
    needs: [clippy, audit, msrv]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch test data
        uses: ./.github/actions/fetch-testdata
      - run: cargo test

  # The library tests open files under testdata/, which WASI can do, so the
  # whole suite runs there. Tests build test-data paths from the absolute
  # workspace path, so wasmtime is given that same directory.
  wasm-test:
    name: Wasm test (wasm32-wasip1)
    needs: [clippy, audit, msrv]
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --dir ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: Fetch test data
        uses: ./.github/actions/fetch-testdata
      - run: cargo test --target wasm32-wasip1 -p jetdb

  # The browser target and WASI are separate builds, and dependencies can
  # compile different code on each (web-time pulls in js-sys only for the
  # browser), so passing on WASI does not cover the browser. This job builds the
  # library for the browser and runs tests/wasm_browser.rs on Node.js; those
  # tests embed their databases and open them from memory, since the browser
  # target has no filesystem. The test runner must be the same version as the
  # wasm-bindgen in Cargo.lock, so the version is read from there.
  wasm-browser-test:
    name: Wasm test (wasm32-unknown-unknown)
    needs: [clippy, audit, msrv]
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install wasm-bindgen
        uses: ./.github/actions/install-wasm-bindgen
      - name: Fetch test data
        uses: ./.github/actions/fetch-testdata
      - run: cargo test --target wasm32-unknown-unknown -p jetdb --test wasm_browser

  # Builds the jetdb-wasm npm package and tests it as npm installs it, through
  # both its Node.js build and its web build. The wasm-bindgen CLI that
  # generates the JavaScript glue must be the same version as the wasm-bindgen
  # in Cargo.lock, so the version is read from there.
  wasm-package-test:
    name: Wasm package (jetdb-wasm)
    needs: [clippy, audit, msrv]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install wasm-bindgen
        uses: ./.github/actions/install-wasm-bindgen
      - name: Fetch test data
        uses: ./.github/actions/fetch-testdata
      - run: scripts/build-wasm-package.sh
      - run: scripts/test-wasm-package.sh
      # The image lists azure.archive.ubuntu.com first in
      # /etc/apt/apt-mirrors.txt, and apt stays on a slow node of it for many
      # minutes (actions/runner-images#14823): fetch from the next one,
      # archive.ubuntu.com.
      - name: Fetch Ubuntu packages from archive.ubuntu.com
        run: |
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          cat /etc/apt/apt-mirrors.txt
      - name: Install the browsers for the pinned Playwright
        working-directory: crates/jetdb-wasm/tests/browser
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium firefox webkit
      - run: scripts/test-wasm-browser.sh

  # Measures the line coverage of the workspace, as scripts/quality-check.sh
  # does (without jetdb-wasm/src/js.rs, which the JavaScript tests exercise), and shows the table of files on the page of the run and, for a pull
  # request from this repository, in a comment on it. The test data is fetched
  # first: without it the tests that need it are skipped and the numbers
  # change.
  coverage:
    name: Coverage
    needs: [clippy, audit, msrv]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Fetch test data
        uses: ./.github/actions/fetch-testdata
      - run: cargo llvm-cov --workspace --no-report
      - name: Show the coverage in the summary of the run
        run: |
          cargo llvm-cov report --summary-only --ignore-filename-regex 'jetdb-wasm/src/js\.rs' > coverage.txt
          {
            echo '## Coverage'
            echo
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep '^TOTAL' coverage.txt
      # One comment, found by its first line and updated on each push. A pull
      # request from a fork gets no token that can write, so it has none.
      - name: Show the coverage on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- jetdb coverage -->'
          fence='```'
          body="$(printf '%s\n## Coverage\n\nFor %s.\n\n%s\n%s\n%s\n' "$marker" "$SHA" "$fence" "$(cat coverage.txt)" "$fence")"
          comments="repos/$GITHUB_REPOSITORY/issues/$PR/comments"
          id="$(gh api --paginate "$comments" --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "$comments" -f body="$body" > /dev/null
          fi

  doc:
    name: Doc
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace
        env:
          RUSTDOCFLAGS: -D warnings
